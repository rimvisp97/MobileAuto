openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /access/me:
    get:
      operationId: getAccessMe
      tags: [access]
      summary: Get the current user's access
      responses:
        "200":
          description: Current access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /access/users:
    get:
      operationId: listAccessUsers
      tags: [access]
      summary: List users and their access
      responses:
        "200":
          description: Access users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUsersResponse"
  /access/users/invite:
    post:
      operationId: inviteAccessUser
      tags: [access]
      summary: Invite an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAccessUserBody"
      responses:
        "201":
          description: Pending invited user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /access/users/{userId}:
    patch:
      operationId: updateAccessUser
      tags: [access]
      summary: Update user status and permissions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessUserBody"
      responses:
        "200":
          description: Updated access user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /parts:
    get:
      operationId: listParts
      tags: [parts]
      summary: List all parts
      responses:
        "200":
          description: Parts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartsResponse"
    post:
      operationId: createPart
      tags: [parts]
      summary: Create a part with a permanent public identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartInput"
      responses:
        "201":
          description: Created part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
  /parts/import:
    post:
      operationId: importParts
      tags: [parts]
      summary: Import existing client-side parts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartImportInput"
      responses:
        "200":
          description: Imported and existing parts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartsResponse"
  /parts/{partId}:
    patch:
      operationId: updatePart
      tags: [parts]
      summary: Update a part without changing its public identifier
      parameters:
        - name: partId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartUpdate"
      responses:
        "200":
          description: Updated part
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
    delete:
      operationId: deletePart
      tags: [parts]
      summary: Delete a part
      parameters:
        - name: partId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Part deleted
  /public/parts/{publicId}:
    get:
      operationId: getPublicPart
      tags: [parts]
      summary: Get the latest public details for a QR identifier
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{20,80}$"
      responses:
        "200":
          description: Current part details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Part"
        "404":
          description: Part not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccessPermissions:
      type: object
      additionalProperties:
        type: boolean
    AccessUser:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
          nullable: true
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, employee]
        status:
          type: string
          enum: [pending, approved, suspended]
        permissions:
          $ref: "#/components/schemas/AccessPermissions"
        invitationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - status
        - permissions
        - createdAt
    AccessUsersResponse:
      type: array
      items:
        $ref: "#/components/schemas/AccessUser"
    InviteAccessUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    UpdateAccessUserBody:
      type: object
      properties:
        status:
          type: string
          enum: [approved, suspended]
        permissions:
          $ref: "#/components/schemas/AccessPermissions"
      required:
        - status
    Part:
      type: object
      required: [id, publicId, donorId, donorLabel, name, code, price, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        publicId:
          type: string
        donorId:
          type: string
        donorLabel:
          type: string
        name:
          type: string
        code:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [inventory, sold]
        location:
          type: ["string", "null"]
        soldAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PartsResponse:
      type: array
      items:
        $ref: "#/components/schemas/Part"
    PartInput:
      type: object
      required: [donorId, donorLabel, name, code, price]
      properties:
        donorId:
          type: string
          minLength: 1
        donorLabel:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        code:
          type: string
        price:
          type: number
          minimum: 0
        location:
          type: string
    PartUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        code:
          type: string
        price:
          type: number
          minimum: 0
        status:
          type: string
          enum: [inventory, sold]
        location:
          type: ["string", "null"]
    PartImportItem:
      type: object
      required: [legacyId, donorId, donorLabel, name, code, price, status, createdAt]
      properties:
        legacyId:
          type: string
          minLength: 1
        donorId:
          type: string
          minLength: 1
        donorLabel:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        code:
          type: string
        price:
          type: number
          minimum: 0
        status:
          type: string
          enum: [inventory, sold]
        location:
          type: string
        createdAt:
          type: string
          format: date-time
        soldAt:
          type: string
          format: date-time
    PartImportInput:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PartImportItem"

