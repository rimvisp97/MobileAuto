openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /access/me:
    get:
      operationId: getAccessMe
      tags: [access]
      summary: Get the current user's access
      responses:
        "200":
          description: Current access state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /access/users:
    get:
      operationId: listAccessUsers
      tags: [access]
      summary: List users and their access
      responses:
        "200":
          description: Access users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUsersResponse"
  /access/users/invite:
    post:
      operationId: inviteAccessUser
      tags: [access]
      summary: Invite an employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteAccessUserBody"
      responses:
        "201":
          description: Pending invited user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
  /access/users/{userId}:
    patch:
      operationId: updateAccessUser
      tags: [access]
      summary: Update user status and permissions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccessUserBody"
      responses:
        "200":
          description: Updated access user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessUser"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccessPermissions:
      type: object
      additionalProperties:
        type: boolean
    AccessUser:
      type: object
      properties:
        id:
          type: integer
        clerkUserId:
          type: string
          nullable: true
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, employee]
        status:
          type: string
          enum: [pending, approved, suspended]
        permissions:
          $ref: "#/components/schemas/AccessPermissions"
        invitationId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - name
        - role
        - status
        - permissions
        - createdAt
    AccessUsersResponse:
      type: array
      items:
        $ref: "#/components/schemas/AccessUser"
    InviteAccessUserBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    UpdateAccessUserBody:
      type: object
      properties:
        status:
          type: string
          enum: [approved, suspended]
        permissions:
          $ref: "#/components/schemas/AccessPermissions"
      required:
        - status

